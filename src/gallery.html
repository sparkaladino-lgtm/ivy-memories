<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ivy Lawson - Gallery</title>
<link rel="icon" type="image/jpeg" href="./favicon.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f0ea;
    color: #1a1815;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .canvas-wrapper {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  .canvas-wrapper.dragging { cursor: grabbing; }
  .canvas-wrapper canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  /* Overlay UI */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.75rem 2.25rem;
    pointer-events: none;
  }
  .overlay a { pointer-events: auto; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.9rem;
    font-weight: 500;
    color: #5a5650;
    text-decoration: none;
    letter-spacing: -0.01em;
    transition: color 0.3s ease, transform 0.3s ease;
  }
  .back-btn:hover {
    color: #1a1815;
    transform: translateX(-3px);
  }
  .back-btn svg {
    width: 16px; height: 16px;
    transition: transform 0.3s ease;
  }
  .back-btn:hover svg { transform: translateX(-3px); }

  .cross-mark {
    font-weight: 300;
    opacity: 0.4;
    font-size: 1rem;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .counter {
    font-size: 0.75rem;
    font-weight: 500;
    color: #5a5650;
    letter-spacing: 0.04em;
  }

  .gallery-title {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 3;
    font-size: clamp(1.2rem, 2vw, 2rem);
    font-weight: 500;
    color: #3a3530;
    letter-spacing: -0.02em;
    pointer-events: none;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeInUp 1s ease 0.8s forwards;
  }
  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Lens Overlay */
  #lensOverlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: #f5f0ea; /* Same as background */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #lensOverlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  #lensCanvasContainer {
    width: 100%;
    height: 100%;
  }
  #lensCanvasContainer canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  #lensCloseBtn {
    position: absolute;
    top: 1.5rem;
    right: 2rem;
    z-index: 11;
    background: rgba(245, 240, 234, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 0, 0, 0.08);
    font-size: 1.75rem;
    cursor: pointer;
    color: #3a3530;
    transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease;
    width: 48px;
    height: 48px;
    min-width: 48px;
    min-height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  #lensCloseBtn:hover {
    transform: scale(1.08);
    background: rgba(245, 240, 234, 1);
    color: #1a1815;
  }
  #lensCloseBtn:active {
    transform: scale(0.95);
  }
  .mobile-hint { display: none; }
  .canvas-wrapper, #lensCanvasContainer { touch-action: none; }

  /* Retro RPG Pixel Dialog */
  .pixel-dialog {
    position: absolute;
    bottom: 5rem;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    width: min(90%, 640px);
    background: rgba(8, 10, 14, 0.85); /* Deep cold dark blue/grey */
    backdrop-filter: blur(12px) contrast(1.1);
    -webkit-backdrop-filter: blur(12px) contrast(1.1);
    /* Fragmented/Broken Pixel Border Effect */
    border: 2px solid rgba(160, 175, 200, 0.4);
    border-style: dashed solid solid dashed;
    box-shadow: 2px 2px 0 0 rgba(0, 0, 0, 0.8), -1px -1px 0 0 rgba(200, 210, 230, 0.1);
    color: #c8d2e0; /* Cold ashen grey-blue */
    padding: 1.25rem 1.5rem;
    z-index: 100; /* Ensure it's heavily layered above everything */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .pixel-dialog.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .pixel-dialog:hover {
    background: rgba(12, 14, 18, 0.90);
    border-color: rgba(180, 195, 220, 0.6);
  }
  .pixel-dialog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px dashed rgba(160, 175, 200, 0.3);
  }
  .pixel-dialog-title-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
    overflow: hidden;
  }
  .pixel-badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    background: #c8d2e0; /* Ash blue */
    color: #080a0e;
    padding: 2px 6px;
    line-height: 1.2;
    display: inline-block;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }
  .pixel-dialog-title {
    font-family: 'Press Start 2P', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 0.75rem;
    color: #ffd000;
    letter-spacing: 0.05em;
    text-shadow: 1px 1px 0 #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pixel-dialog-step {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.65rem;
    color: #b3aba2;
    letter-spacing: 0.08em;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 0.5rem;
  }
  .pixel-dialog-body {
    min-height: 3.8rem;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    font-size: 0.95rem;
    line-height: 1.7;
    color: #f5f0ea;
    letter-spacing: 0.03em;
    word-break: break-word;
    display: block;
    max-height: 40vh;
    overflow-y: auto;
  }
  .pixel-dialog-text {
    display: inline;
  }
  .pixel-cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    margin-left: 4px;
    vertical-align: -2px;
    background: #ffd000;
    box-shadow: 1px 1px 0 #000;
    animation: pixelCursorBlink 0.7s steps(2, start) infinite;
  }
  @keyframes pixelCursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .pixel-dialog-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.65rem;
    padding-top: 0.4rem;
    border-top: 1px solid rgba(245, 240, 234, 0.12);
  }
  .pixel-hint-tip {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    color: rgba(245, 240, 234, 0.45);
    letter-spacing: 0.06em;
  }
  .pixel-action-prompt {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    color: #ffd000;
    letter-spacing: 0.08em;
    animation: pixelPromptBounce 1s ease-in-out infinite alternate;
  }
  @keyframes pixelPromptBounce {
    from { transform: translateY(0); }
    to { transform: translateY(-2px); }
  }

  @media (max-width: 768px), (pointer: coarse) {
    html, body { height: 100dvh; overscroll-behavior: none; }
    .overlay {
      padding: calc(0.75rem + env(safe-area-inset-top)) calc(1.25rem + env(safe-area-inset-right)) calc(1.25rem + env(safe-area-inset-bottom)) calc(1.25rem + env(safe-area-inset-left));
    }
    .back-btn { min-height: 44px; min-width: 44px; }
    .footer { justify-content: flex-start; }
    .gallery-title { bottom: calc(1.25rem + env(safe-area-inset-bottom)); right: calc(1.25rem + env(safe-area-inset-right)); }
    .mobile-hint {
      display: block; position: fixed; left: 0; right: 0;
      bottom: calc(4.5rem + env(safe-area-inset-bottom)); text-align: center;
      color: #5a5650; font-size: 0.75rem; pointer-events: none;
    }
    #lensCloseBtn {
      top: calc(0.75rem + env(safe-area-inset-top));
      right: calc(0.75rem + env(safe-area-inset-right));
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 50%;
      background: rgba(245, 240, 234, 0.92);
    }
    .pixel-dialog {
      bottom: calc(0.85rem + env(safe-area-inset-bottom));
      width: calc(100% - 1.5rem);
      max-width: 500px;
      padding: 0.75rem 0.9rem;
      border-width: 2px;
      outline-width: 2px;
      outline-offset: -4px;
      box-shadow: 0 4px 0 0 #1a1815, 0 8px 16px rgba(0, 0, 0, 0.5);
    }
    .pixel-dialog-header {
      margin-bottom: 0.45rem;
      padding-bottom: 0.35rem;
    }
    .pixel-dialog-title-wrap {
      gap: 0.35rem;
    }
    .pixel-badge {
      font-size: 0.46rem;
      padding: 1px 4px;
    }
    .pixel-dialog-title {
      font-size: 0.60rem;
    }
    .pixel-dialog-step {
      font-size: 0.55rem;
      margin-left: 0.35rem;
    }
    .pixel-dialog-body {
      min-height: 3.2rem;
      font-size: 0.85rem;
      line-height: 1.55;
    }
    .pixel-cursor {
      width: 7px;
      height: 13px;
    }
    .pixel-dialog-footer {
      margin-top: 0.45rem;
      padding-top: 0.3rem;
    }
    .pixel-hint-tip {
      font-size: 0.45rem;
    }
    .pixel-action-prompt {
      font-size: 0.5rem;
    }
  }

  @media (max-width: 360px) {
    .pixel-dialog {
      padding: 0.6rem 0.65rem;
      bottom: calc(0.5rem + env(safe-area-inset-bottom));
    }
    .pixel-dialog-title-wrap {
      gap: 0.25rem;
    }
    .pixel-badge {
      font-size: 0.40rem;
      padding: 1px 3px;
    }
    .pixel-dialog-title {
      font-size: 0.48rem;
      letter-spacing: 0.02em;
    }
    .pixel-dialog-step {
      font-size: 0.46rem;
      margin-left: 0.25rem;
    }
    .pixel-dialog-body {
      font-size: 0.78rem;
      line-height: 1.5;
      min-height: 2.8rem;
    }
  }

  @media (max-height: 560px) {
    .pixel-dialog {
      bottom: max(0.5rem, calc(0.4rem + env(safe-area-inset-bottom)));
      padding: 0.6rem 0.85rem;
    }
    .pixel-dialog-header {
      margin-bottom: 0.35rem;
      padding-bottom: 0.25rem;
    }
    .pixel-dialog-body {
      min-height: auto;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .pixel-dialog-footer {
      margin-top: 0.35rem;
      padding-top: 0.25rem;
    }
  }

  @media (max-height: 400px) {
    .pixel-dialog {
      bottom: 0.35rem;
      padding: 0.45rem 0.65rem;
    }
    .pixel-badge {
      font-size: 0.42rem;
      padding: 1px 3px;
    }
    .pixel-dialog-title {
      font-size: 0.55rem;
    }
    .pixel-dialog-step {
      font-size: 0.50rem;
    }
    .pixel-dialog-body {
      font-size: 0.78rem;
      line-height: 1.35;
    }
  }
</style>
</head>
<body>

<div class="canvas-wrapper" id="canvasWrapper"></div>

<div class="overlay">
  <header class="header">
    <a class="back-btn" href="./index.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back
    </a>
    <span class="cross-mark">+</span>
  </header>
  <footer class="footer">
    <div class="counter" id="counter"></div>
  </footer>

</div>

<div class="gallery-title">My Memory</div>

<!-- Lens Overlay Container -->
<div id="lensOverlay">
  <button id="lensCloseBtn" aria-label="关闭照片">&times;</button>
  <div id="lensCanvasContainer"></div>

  <!-- Retro RPG Pixel Dialog -->
  <div id="pixelDialog" class="pixel-dialog" role="dialog" aria-live="polite">
    <div class="pixel-dialog-header">
      <div class="pixel-dialog-title-wrap">
        <span class="pixel-badge">MSG</span>
        <span class="pixel-dialog-title" id="pixelDialogTitle">ARCHIVE // 00</span>
      </div>
      <div class="pixel-dialog-step" id="pixelDialogStep">1 / 3</div>
    </div>
    <div class="pixel-dialog-body">
      <span class="pixel-dialog-text" id="pixelDialogText"></span><span class="pixel-cursor" id="pixelCursor"></span>
    </div>
    <div class="pixel-dialog-footer">
      <span class="pixel-hint-tip">PRESS / CLICK</span>
      <span class="pixel-action-prompt" id="pixelActionPrompt">TYPING...</span>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from "three";

(function () {
  "use strict";

  /* ── Image list (Original PNG) ── */
  var IMAGES = [
    "./img/1.webp", "./img/2.webp", "./img/3.webp", "./img/4.webp",
    "./img/5.webp", "./img/6.webp", "./img/7.webp", "./img/8.webp",
    "./img/9.webp", "./img/10.webp", "./img/11.webp", "./img/12.webp",
    "./img/13.webp"
  ];
  var TOTAL = IMAGES.length;

  document.getElementById("counter").textContent = "/" + TOTAL + " Photos";

  /* ── Constants ── */
  var PLANE_ASPECT = 5 / 3;
  var GAP_RATIO    = 0.018;
  var MAX_VEL      = 1.0;
  var BASE_SPEED   = 0.08;   // slow auto-scroll (world units / s)
  var isTouch = window.matchMedia("(pointer: coarse)").matches;

  /* ── Three.js basics ── */
  var wrap = document.getElementById("canvasWrapper");
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  wrap.appendChild(renderer.domElement);

  var scene  = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
  camera.position.set(0, 0, 5);
  
  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();

  /* ── Shaders (Reel-Flux wave effect) ── */
  var VS = [
    "uniform float uVel;",
    "uniform float uFreq;",
    "uniform float uAmpY;",
    "uniform float uAmpZ;",
    "uniform float uTwist;",
    "varying vec2 vUv;",
    "void main(){",
    "  vUv = uv;",
    "  vec4 wp = modelMatrix * vec4(position,1.0);",
    "  float ph = wp.x * uFreq;",
    "  float s  = sin(ph);",
    "  float c  = cos(ph);",
    "  float dy = s * uVel * uAmpY;",
    "  float dz = c * uVel * uAmpZ;",
    "  float tw = position.y * s * uVel * uTwist;",
    "  float dx = s * c * uVel * -0.05;",
    "  vec3 d = position + vec3(dx, dy, dz + tw);",
    "  gl_Position = projectionMatrix * modelViewMatrix * vec4(d,1.0);",
    "}"
  ].join("\n");

  var FS = [
    "precision highp float;",
    "uniform sampler2D uMap;",
    "uniform vec2 uScale;",
    "varying vec2 vUv;",
    "void main(){",
    "  vec2 cv = (vUv - 0.5) * uScale + 0.5;",
    "  vec4 bc = texture2D(uMap, cv);",
    "  float luma = dot(bc.rgb, vec3(0.2126,0.7152,0.0722));",
    "  vec3 gray = vec3(luma);",
    "  vec3 sat = mix(gray, bc.rgb, 0.82);",
    "  vec3 tone = sat * 1.02 + vec3(0.015);",
    "  gl_FragColor = vec4(tone, bc.a);",
    "}"
  ].join("\n");

  /* ── Shared uniforms (by reference) ── */
  var uVel   = { value: 0 };
  var uFreq  = { value: 1.15 };
  var uAmpY  = { value: 0.48 };
  var uAmpZ  = { value: 0.80 };
  var uTwist = { value: 0.35 };

  /* ── Geometry & dimension helpers ── */
  var planeW, planeH, stride, totalW, halfW;
  var meshes = [];
  var geometry;

  function vp() {
    var rad = camera.fov * Math.PI / 180;
    var h   = 2 * camera.position.z * Math.tan(rad / 2);
    return { w: h * camera.aspect, h: h };
  }

  function dims() {
    var v  = vp();
    var portrait = camera.aspect < 1.1;
    var maxW = v.w * (portrait ? 0.86 : 0.42);
    var nomH = v.h * (portrait ? 0.35 : 0.40);
    var nomW = nomH * PLANE_ASPECT;
    planeW   = Math.min(nomW, maxW);
    if (portrait && isTouch) planeW = maxW;
    planeH   = planeW / PLANE_ASPECT;
    stride   = planeW * (1 + GAP_RATIO);
    totalW   = TOTAL * stride;
    halfW    = totalW / 2;
    var wl   = stride * 1.82;
    uFreq.value  = (Math.PI * 2) / wl;
    uAmpY.value  = planeH * 0.3;
    uAmpZ.value  = planeH * 0.3;
    uTwist.value = planeH * 0.08;
  }

  /* ── Build scene ── */
  var loader = new THREE.TextureLoader();
  var textures = [];

  function build() {
    meshes.forEach(function(m){ scene.remove(m); m.material.dispose(); });
    meshes = [];
    if (geometry) geometry.dispose();

    dims();
    geometry = new THREE.PlaneGeometry(planeW, planeH, 64, 16);

    IMAGES.forEach(function(src, i) {
      var tex = textures[i] || loader.load(
        src,
        function(loaded) {
          var current = meshes[i];
          if (current && current.userData.texture === loaded) updateImageScale(current.material, loaded);
        }
      );
      textures[i] = tex;
      tex.colorSpace = THREE.SRGBColorSpace;

      function updateImageScale(mat, tex) {
        if (tex.image) {
          var ia = tex.image.width / tex.image.height;
          if (ia > PLANE_ASPECT) mat.uniforms.uScale.value.set(PLANE_ASPECT / ia, 1);
          else mat.uniforms.uScale.value.set(1, ia / PLANE_ASPECT);
        }
      }

      var mat = new THREE.ShaderMaterial({
        vertexShader: VS,
        fragmentShader: FS,
        side: THREE.DoubleSide,
        transparent: true,
        uniforms: {
          uMap:   { value: tex },
          uScale: { value: new THREE.Vector2(1, 1) },
          uVel:   uVel,
          uFreq:  uFreq,
          uAmpY:  uAmpY,
          uAmpZ:  uAmpZ,
          uTwist: uTwist,
        },
      });

      var mesh = new THREE.Mesh(geometry, mat);
      updateImageScale(mat, tex);
      mesh.frustumCulled = false;
      mesh.userData = { isClickable: true, texture: tex, photoIndex: i }; // Save texture & index for lens effect & retro dialog
      scene.add(mesh);
      meshes.push(mesh);
    });
  }

  /* ── Resize ── */
  function onResize() {
    var oldStride = stride;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    build();
    if (oldStride && Number.isFinite(scrollOffset)) scrollOffset *= stride / oldStride;
  }
  window.addEventListener("resize", onResize);
  onResize();

  /* ── Scroll / drag input ── */
  var scrollOffset = 0;
  var velocity     = 0;
  var smoothVel    = 0;
  var dragging     = false;
  var startX       = 0;
  var startY       = 0;
  var lastX        = 0;
  var lastT        = 0;
  var pointerDownTime = 0;
  var dragVel      = 0;
  var activePointer = null;
  var maxDragDistance = 0;
  var pauseUntil = 0;

  wrap.addEventListener("wheel", function(e) {
    e.preventDefault();
    if(lensActive) return;
    var d = (Math.abs(e.deltaX) > Math.abs(e.deltaY)) ? e.deltaX : e.deltaY;
    velocity += d * 0.003;
    pauseUntil = performance.now() + 3500;
  }, { passive: false });

  wrap.addEventListener("pointerdown", function(e) {
    if(lensActive || activePointer !== null || (e.pointerType === "mouse" && e.button !== 0)) return;
    activePointer = e.pointerId;
    maxDragDistance = 0;
    velocity = 0;
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    lastX = e.clientX;
    lastT = performance.now();
    pointerDownTime = performance.now();
    dragVel = 0;
    wrap.classList.add("dragging");
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove", function(e) {
    if (!dragging || lensActive || e.pointerId !== activePointer) return;
    var now = performance.now();
    var dx  = e.clientX - lastX;
    var dt  = Math.max(1, now - lastT) / 1000;

    },
    {
      title: "ARCHIVE // 13 · My Memory",
      lines: [
        "我的指尖捻开的是跨越维度的裂隙, 我的每一步前行都被命运的枷锁与自我的执念牢牢牵引, 最终在时空的迷雾中, 弄丢了最初的自己, 也永远失去了生命中最珍贵的陪伴.",
        "Who are you?",
        "I am you."

  ];

  var pixelDialog = document.getElementById("pixelDialog");
  var pixelDialogTitle = document.getElementById("pixelDialogTitle");
  var pixelDialogStep = document.getElementById("pixelDialogStep");
  var pixelDialogText = document.getElementById("pixelDialogText");
  var pixelActionPrompt = document.getElementById("pixelActionPrompt");

  var storyState = {
    photoIndex: 0,
    stepIndex: 0,
    charIndex: 0,
    isTyping: false,
    timer: null
  };

  function getStoryForPhoto(idx) {
    if (typeof idx === "number" && GALLERY_STORIES[idx]) {
      return GALLERY_STORIES[idx];
    }
    var padIdx = (typeof idx === "number" && idx >= 0) ? (idx < 10 ? "0" + idx : "" + idx) : "??";
    return {
      title: "ARCHIVE // " + padIdx + " · 浮光记忆",
      lines: [
        "画面定格在时间长河的一瞬，泛起微弱的涟漪。",
        "视线交汇的瞬间，所有静止的思绪重新流淌。",
        "这是属于流光忽度与常青藤的永恒记录。"
      ]
    };
  }

  function updatePromptStatus() {
    var story = getStoryForPhoto(storyState.photoIndex);
    if (storyState.stepIndex < story.lines.length - 1) {
      if (pixelActionPrompt) pixelActionPrompt.textContent = "NEXT ▼";
    } else {
      if (pixelActionPrompt) pixelActionPrompt.textContent = "FIN ■";
    }
  }

  var audioCtx = null;
  function playTypeSound() {
    try {
      if (!audioCtx) {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        if (window.AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'running') {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300 + Math.random() * 150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } else if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    } catch(e) {}
  }

  var storyStartTimer = null;

  function renderStoryStep() {
    if (storyState.timer) {
      clearTimeout(storyState.timer);
      storyState.timer = null;
    }
    var story = getStoryForPhoto(storyState.photoIndex);
    var currentLine = story.lines[storyState.stepIndex] || "";

    if (pixelDialogTitle) pixelDialogTitle.textContent = story.title;
    if (pixelDialogStep) pixelDialogStep.textContent = (storyState.stepIndex + 1) + " / " + story.lines.length;
    if (pixelDialogText) pixelDialogText.textContent = "";
    storyState.charIndex = 0;
    if (!currentLine) {
      storyState.isTyping = false;
      updatePromptStatus();
      return;
    }

    storyState.isTyping = true;
    if (pixelActionPrompt) pixelActionPrompt.textContent = "TYPING...";

    function typeChar() {
      if (!storyState.isTyping) return;
      if (storyState.charIndex < currentLine.length) {
        storyState.charIndex++;
        if (pixelDialogText) {
          pixelDialogText.textContent = currentLine.slice(0, storyState.charIndex);
          if (currentLine[storyState.charIndex - 1].trim() !== "") {
            playTypeSound();
          }
        }
      }
      if (storyState.charIndex < currentLine.length) {
        storyState.timer = setTimeout(typeChar, 35);
      } else {
        storyState.isTyping = false;
        storyState.timer = null;
        updatePromptStatus();
      }
    }
    typeChar();
  }

  function advanceStory() {
    if (!lensActive || !pixelDialog || !pixelDialog.classList.contains("active") || isTransitioningPhoto) return;
    var story = getStoryForPhoto(storyState.photoIndex);
    var currentLine = story.lines[storyState.stepIndex] || "";

    // 1. 若当前正在逐字打字（或文本尚未完全展示），用户轻触/点击立即快速完成本句输出
    if (storyState.isTyping || (pixelDialogText && pixelDialogText.textContent !== currentLine)) {
      if (storyState.timer) {
        clearTimeout(storyState.timer);
        storyState.timer = null;
      }
      storyState.isTyping = false;
      if (pixelDialogText) {
        pixelDialogText.textContent = currentLine;
      }
      storyState.charIndex = currentLine.length;
      updatePromptStatus();
      return;
    }

    // 2. 若当前句已输出完毕且不是最后一句，推进到下一段
    if (storyState.stepIndex < story.lines.length - 1) {
      storyState.stepIndex++;
      renderStoryStep();
      return;
    }

    // 3. 所有段落播放完毕后，扭曲跳转下一张
    goToNextPhoto();
  }

  var isTransitioningPhoto = false;
  var photoTransitionReq = null;

  function cancelPhotoTransition() {
    if (photoTransitionReq) {
      cancelAnimationFrame(photoTransitionReq);
      photoTransitionReq = null;
    }
    if (isTransitioningPhoto) {
      isTransitioningPhoto = false;
      if (lensUniforms) {
        lensUniforms.u_lensDistortion.value = 0.7;
        lensUniforms.u_rgbShiftR.value = 0.02;
        lensUniforms.u_rgbShiftB.value = -0.02;
        lensUniforms.u_waveStrength.value = 0.0;
      }
    }
  }

  function goToNextPhoto() {
    if (isTransitioningPhoto) return;
    isTransitioningPhoto = true;

    stopStory();

    var nextPhotoIndex = (storyState.photoIndex + 1) % IMAGES.length;
    var nextMesh = meshes.find(function(m) { return m.userData && m.userData.photoIndex === nextPhotoIndex; });
    var nextTex = (nextMesh && nextMesh.userData && nextMesh.userData.texture) ? nextMesh.userData.texture : textures[nextPhotoIndex];

    if (!nextTex) {
      isTransitioningPhoto = false;
      return;
    }

    if (storyStartTimer) {
      clearTimeout(storyStartTimer);
      storyStartTimer = null;
    }
    storyStartTimer = setTimeout(function() {
      storyStartTimer = null;
      if (!lensActive) return;
      startStory(nextPhotoIndex);
    }, 800);

    var duration = 600;
    var startTime = performance.now();
    var origDist = (lensUniforms && typeof lensUniforms.u_lensDistortion.value === 'number') ? lensUniforms.u_lensDistortion.value : 0.7;

    function animateTransition(time) {
      var progress = (time - startTime) / duration;
      if (progress < 0.5) {
        var p = progress * 2;
        lensUniforms.u_lensDistortion.value = origDist - p * 2.0;
        lensUniforms.u_rgbShiftR.value = 0.12 * p;
        lensUniforms.u_rgbShiftB.value = -0.12 * p;
        lensUniforms.u_waveStrength.value = p * 0.2;
        photoTransitionReq = requestAnimationFrame(animateTransition);
      } else if (progress < 1) {
        if (lensUniforms.u_texture1.value !== nextTex) {
           lensUniforms.u_texture1.value = nextTex;
           lensUniforms.u_texture2.value = nextTex;
           if(nextTex.image) {
             lensUniforms.u_textureSize1.value.set(nextTex.image.width, nextTex.image.height);
             lensUniforms.u_textureSize2.value.set(nextTex.image.width, nextTex.image.height);
           }
           resetLensZoom();
           resizeLens();
        }
        var p = (1 - progress) * 2;
        lensUniforms.u_lensDistortion.value = origDist - p * 2.0;
        lensUniforms.u_rgbShiftR.value = 0.12 * p;
        lensUniforms.u_rgbShiftB.value = -0.12 * p;
        lensUniforms.u_waveStrength.value = p * 0.2;
        photoTransitionReq = requestAnimationFrame(animateTransition);
      } else {
        lensUniforms.u_lensDistortion.value = origDist;
        lensUniforms.u_rgbShiftR.value = 0.02;
        lensUniforms.u_rgbShiftB.value = -0.02;
        lensUniforms.u_waveStrength.value = 0.0;
        photoTransitionReq = null;
        isTransitioningPhoto = false;
      }
    }
    photoTransitionReq = requestAnimationFrame(animateTransition);
  }

  function startStory(photoIdx) {
    if (!lensActive) return;
    if (storyStartTimer) {
      clearTimeout(storyStartTimer);
      storyStartTimer = null;
    }
    if (storyState.timer) {
      clearTimeout(storyState.timer);
      storyState.timer = null;
    }
    storyState.photoIndex = (typeof photoIdx === "number") ? photoIdx : 0;
    storyState.stepIndex = 0;
    storyState.charIndex = 0;
    storyState.isTyping = false;
    if (pixelDialog) {
      pixelDialog.classList.add("active");
    }
    renderStoryStep();
  }

  function stopStory() {
    if (storyStartTimer) {
      clearTimeout(storyStartTimer);
      storyStartTimer = null;
    }
    if (storyState.timer) {
      clearTimeout(storyState.timer);
      storyState.timer = null;
    }
    storyState.isTyping = false;
    if (pixelDialog) {
      pixelDialog.classList.remove("active");
      if (pixelDialogText) pixelDialogText.textContent = "";
      if (pixelDialogTitle) pixelDialogTitle.textContent = "";
    }
  }

  if (pixelDialog) {
    pixelDialog.addEventListener("click", function(e) {
      e.stopPropagation();
      advanceStory();
    });
    ["pointerdown", "pointerup", "pointermove", "touchstart", "touchend", "dblclick"].forEach(function(evt) {
      pixelDialog.addEventListener(evt, function(e) {
        e.stopPropagation();
      });
    });
  }

  function openLensOverlay(tex, photoIndex) {
    if (closeLensTimer) {
      clearTimeout(closeLensTimer);
      closeLensTimer = null;
    }
    if (openLensTimer) {
      clearTimeout(openLensTimer);
      openLensTimer = null;
    }
    stopStory();
    cancelPhotoTransition();
    if (document.activeElement && typeof document.activeElement.blur === "function") {
      document.activeElement.blur();
    }
    if(!lensRenderer) initLensSystem();

    lensUniforms.u_texture1.value = tex;
    lensUniforms.u_texture2.value = tex;
    if(tex.image) {
      lensUniforms.u_textureSize1.value.set(tex.image.width, tex.image.height);
      lensUniforms.u_textureSize2.value.set(tex.image.width, tex.image.height);
    }
    
    resetLensZoom();
    resizeLens();
    lensMouseEase.copy(isTouch ? new THREE.Vector2(0, 0.2) : pointer);
    lensMouse.copy(lensMouseEase);

    lensTransitioning = true;
    lensOverlay.classList.add("active");
    lensActive = true;
    
    if (storyStartTimer) {
      clearTimeout(storyStartTimer);
      storyStartTimer = null;
    }
    storyStartTimer = setTimeout(function() {
      storyStartTimer = null;
      if (!lensActive) return;
      startStory(photoIndex);
    }, 800);

    openLensTimer = setTimeout(function() {
      openLensTimer = null;
      lensTransitioning = false;
    }, 400);
  }

  window.__openPhoto = function(idx) {
    var targetIdx = (typeof idx === "number" && idx >= 0 && idx < TOTAL) ? idx : 0;
    var targetMesh = meshes.find(function(m) { return m.userData && m.userData.photoIndex === targetIdx; });
    var targetTex = (targetMesh && targetMesh.userData && targetMesh.userData.texture) ? targetMesh.userData.texture : textures[targetIdx];
    if (targetTex) {
      openLensOverlay(targetTex, targetIdx);
    }
  };

  function lensRender(time, dt) {
    lensMouseEase.lerp(lensMouse, 1 - Math.pow(0.85, dt * 60));
    lensUniforms.u_mouse.value.copy(lensMouseEase);
    lensUniforms.u_time.value = time * 0.001;
    lensRenderer.render(lensScene, lensCamera);
  }

  window.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      if (lensActive) {
        closeLens();
      } else {
        window.location.href = "./index.html";
      }
    } else if (lensActive && (e.key === " " || e.key === "Enter")) {
      e.preventDefault();
      if (e.repeat) return;
      advanceStory();
    }
  });

})();
